name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BACKEND_IMAGE: rinasck/devops-assessment-backend
  FRONTEND_IMAGE: rinasck/devops-assessment-frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Compose configuration
        run: |
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          docker compose -f docker-compose.prod.yml config

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=http://api.debyez.localhost/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
